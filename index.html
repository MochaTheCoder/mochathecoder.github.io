<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MochaTheCoder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #58a6ff;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #8b949e;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .links a {
      display: block;
      padding: 0.75rem 1.5rem;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #58a6ff;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .links a:hover {
      background: #161b22;
      border-color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://github.com/mochathecoder.png" alt="Avatar" class="avatar">
    <h1>MochaTheCoder</h1>
    <p class="tagline">Developer &amp; Creator</p>
    <div class="links">
      <a href="https://github.com/MochaTheCoder">GitHub</a>
    </div>
  </div>
</body>
</html>
